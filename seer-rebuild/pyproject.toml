[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seer-rebuild"
version = "0.1.0"
description = "雷小伊脱机日常 2.0.9 的登录/协议/脚本/战斗/观测重建"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
seer-rebuild = "seer_rebuild.cli:main"

[tool.setuptools.packages.find]
include = ["seer_rebuild*"]

[tool.setuptools.package-data]
seer_rebuild = ["data/login_template.bin"]