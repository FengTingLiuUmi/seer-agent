<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>赛尔号 · 登录控制台</title>
<style>
:root{
  --bg:#070c14; --panel:#0d1624; --panel2:#111d2f; --line:#1e3348;
  --txt:#dbe7f5; --dim:#7d93ad; --gold:#f5c86b; --cyan:#4fd1e0; --green:#5ce39a; --red:#ff6b6b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font:14px/1.6 "Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  color:var(--txt);background:radial-gradient(1200px 600px at 20% -10%,#123049 0%,transparent 60%),
  radial-gradient(900px 500px at 110% 120%,#1a2740 0%,transparent 55%),var(--bg);
  min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px;
}
.stars{position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),
  radial-gradient(1px 1px at 70% 15%,#cfe,transparent),
  radial-gradient(1.5px 1.5px at 40% 80%,#fff,transparent),
  radial-gradient(1px 1px at 85% 60%,#9df,transparent),
  radial-gradient(1px 1px at 10% 65%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 55% 45%,#fff,transparent);}
.shell{position:relative;width:min(1080px,100%);display:grid;grid-template-columns:400px 1fr;gap:18px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04)}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:2px}
.logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  background:conic-gradient(from 210deg,#2b6c8f,#f5c86b,#2b6c8f);box-shadow:0 0 24px rgba(79,209,224,.35)}
.logo svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
h1{font-size:20px;margin:0;letter-spacing:.5px}
.sub{color:var(--dim);font-size:12px;margin-top:2px}
.login{padding:26px}
.field{margin-top:18px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;letter-spacing:.4px}
.input{display:flex;align-items:center;background:#0a1421;border:1px solid var(--line);border-radius:10px;
  padding:0 12px;transition:border-color .15s,box-shadow .15s}
.input:focus-within{border-color:#2f7d97;box-shadow:0 0 0 3px rgba(79,209,224,.12)}
.input svg{opacity:.55}
.input input{flex:1;background:transparent;border:0;outline:0;color:var(--txt);padding:12px 10px;font-size:15px;letter-spacing:.5px}
.input input::placeholder{color:#4d6580}
.btn{width:100%;margin-top:22px;border:0;border-radius:10px;padding:13px;cursor:pointer;
  font:600 15px/1 "Microsoft YaHei UI",sans-serif;letter-spacing:2px;color:#1a1206;
  background:linear-gradient(180deg,#ffd98a,#e9ae4b);box-shadow:0 8px 22px rgba(233,174,75,.22);
  transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px)}
.btn[disabled]{filter:grayscale(.7) brightness(.7);cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);box-shadow:none;
  font-weight:500;letter-spacing:1px;margin-top:10px;padding:9px}
.hint{margin-top:14px;font-size:12px;color:var(--dim);min-height:20px}
.hint.err{color:var(--red)} .hint.ok{color:var(--green)}
.status{padding:22px 22px 18px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;font-size:12px;
  border:1px solid var(--line);background:#0a1421;color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.pill.on{color:var(--green);border-color:#1f4b39}.pill.on .dot{background:var(--green);box-shadow:0 0 10px var(--green)}
.pill.warn{color:var(--gold);border-color:#4b3f1f}.pill.warn .dot{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.pill.err{color:var(--red);border-color:#4b1f1f}.pill.err .dot{background:var(--red);box-shadow:0 0 10px var(--red)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{background:#0a1421;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.kv .k{font-size:11px;color:var(--dim);letter-spacing:.5px}
.kv .v{font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv .v.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:12px}
.log{background:#070f19;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;
  min-height:190px;max-height:260px}
.log h3{margin:0;padding:10px 12px;font-size:12px;letter-spacing:1px;color:var(--dim);font-weight:600;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#0a1421}
.log .body{overflow:auto;padding:6px 10px;font:12px/1.55 Consolas,"Cascadia Mono",monospace}
.row{display:flex;gap:8px;padding:2px 0;border-bottom:1px dashed rgba(30,51,72,.5)}
.row .t{color:#4d6580;flex:0 0 58px}
.row .c{flex:0 0 94px;color:var(--cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.s2c .c{color:var(--gold)} .row.err .c{color:var(--red)}
.row .m{color:#a9bdd4;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.console{padding:0 22px 22px}
.console .bar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.console .bar input{flex:1;min-width:180px;background:#0a1421;border:1px solid var(--line);border-radius:8px;
  color:var(--txt);padding:8px 10px;font:12px Consolas,monospace;outline:0}
.mini{background:#122439;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 12px;
  cursor:pointer;font-size:12px;white-space:nowrap}
.mini:hover{border-color:#2f7d97}
.mini.primary{background:#1b4160;border-color:#2b6c8f}
.out{background:#070f19;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:170px;
  overflow:auto;font:12px/1.5 Consolas,monospace;color:#a9bdd4;white-space:pre-wrap;word-break:break-all}
.foot{display:flex;justify-content:space-between;font-size:11px;color:#3f566f;padding:0 4px}
@media(max-width:900px){.shell{grid-template-columns:1fr}body{align-items:flex-start;padding:16px}}
</style>
</head>
<body>
<div class="stars"></div>
<div class="shell">
  <!-- 左：登录 -->
  <section class="card login">
    <div class="brand">
      <div class="logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#08121e" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3.2c3.6 3.9 3.6 13.7 0 17.6M12 3.2c-3.6 3.9-3.6 13.7 0 17.6"/>
        </svg>
      </div>
      <div>
        <h1>赛尔号 · 登录控制台</h1>
        <div class="sub">seer-service · Flash/Unity 协议同源</div>
      </div>
    </div>

    <div class="field">
      <label>米米号</label>
      <div class="input">
        <svg width="16" height="16" viewBox="0 0 24 24" stroke="#7d93ad" fill="none" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.2-3.6 4-5.4 7.5-5.4s6.3 1.8 7.5 5.4"/></svg>
        <input id="account" value="ACCOUNT" autocomplete="username" spellcheck="false">
      </div>
    </div>
    <div class="field">
      <label>密码</label>
      <div class="input">
        <svg width="16" height="16" viewBox="0 0 24 24" stroke="#7d93ad" fill="none" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input id="password" type="password" placeholder="留空 = 使用已加密保存的凭据" autocomplete="current-password">
      </div>
    </div>
    <button class="btn" id="loginBtn">登 录</button>
    <button class="btn ghost" id="logoutBtn">断开当前会话</button>
    <div class="hint" id="hint">凭据只在本机解密，不落盘；同一账号只允许一条连接。</div>
  </section>

  <!-- 右：状态 -->
  <section class="card status">
    <div class="top">
      <div>
        <div class="pill" id="pill"><span class="dot"></span><span id="pillTxt">未连接</span></div>
      </div>
      <div class="pill" id="coolPill" style="display:none"><span class="dot"></span><span id="coolTxt"></span></div>
    </div>

    <div class="grid">
      <div class="kv"><div class="k">玩家</div><div class="v" id="vNick">—</div></div>
      <div class="kv"><div class="k">地图</div><div class="v" id="vMap">—</div></div>
      <div class="kv"><div class="k">会话</div><div class="v mono" id="vSess">—</div></div>
      <div class="kv"><div class="k">在线时长</div><div class="v" id="vUp">—</div></div>
    </div>

    <div class="log">
      <h3><span>实时帧</span><span id="evCount" style="font-weight:400">0</span></h3>
      <div class="body" id="evBody"></div>
    </div>

    <div class="console">
      <div class="bar">
        <input id="cmdIn" value="2303" placeholder="cmd 或 名称，如 2303 / 2003 / 3401">
        <button class="mini primary" id="sendBtn">发送</button>
        <button class="mini" id="petsBtn">精灵列表</button>
      </div>
      <div class="out" id="out">// 发送命令后在这里看回包（bodyHex 前 96 字节）</div>
    </div>
    <div class="foot"><span>seer-service :7820</span><span id="footState">idle</span></div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const api = async (p, opt) => {
  const r = await fetch(p, opt);
  return await r.json();
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let since = 0, pollTimer = null, busy = false;

function setPill(cls, text){
  $('#pill').className = 'pill ' + cls;
  $('#pillTxt').textContent = text;
}

function fmtDur(sec){
  if (!sec && sec !== 0) return '—';
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return (h?h+'h ':'') + (h||m?m+'m ':'') + s+'s';
}

async function refresh(){
  if (busy) return;
  try{
    const st = await api('/api/status');
    const state = st.state || {};
    const map = state.map || {};
    if (st.ready) setPill('on', '已进入世界');
    else if (st.process) setPill('warn', '登录中…');
    else if (st.dead_reason) setPill('err', '连接异常');
    else setPill('', '未连接');
    if (st.dead_reason && !st.ready) $('#hint').textContent = st.dead_reason;

    $('#vNick').textContent = (map.nick || (state.players[0] && state.players[0].name) || '—');
    $('#vMap').textContent = state.entered
      ? (map.map_name || ('#' + (map.map_id ?? (map.head || '?').slice(0, 8))))
      : '—';
    $('#vSess').textContent = st.ready ? (st.serving + ' · ' + (st.login_cooldown_left ? '冷却 '+st.login_cooldown_left+'s' : 'ok')) : '—';
    $('#vSess').title = st.serving || '';
    $('#vUp').textContent = st.ready && st.ready_at ? fmtDur((Date.now()/1000) - st.ready_at) : '—';
    $('#footState').textContent = st.ready ? 'ready' : (st.process ? 'connecting' : 'idle');

    if (st.login_cooldown_left > 0){
      $('#coolPill').style.display = '';
      $('#coolTxt').textContent = '冷却 ' + st.login_cooldown_left + 's';
    } else $('#coolPill').style.display = 'none';

    const ev = await api('/api/events?since=' + since + '&limit=60');
    if (ev.events && ev.events.length){
      for (const e of ev.events){
        since = Math.max(since, e.seq || 0);
        appendEvent(e);
      }
      $('#evCount').textContent = since;
    }
  }catch(err){
    setPill('err', '服务离线');
    $('#footState').textContent = 'offline';
  }
}

function appendEvent(e){
  const body = $('#evBody');
  const row = document.createElement('div');
  let cls = 'row', code = '', msg = '';
  if (e.type === 's2c'){ cls += ' s2c'; code = e.cmd + ' ' + (e.name || ''); msg = 'len=' + e.len + (e.res ? ' res=' + e.res : '') + ' ' + (e.bodyHex || '').slice(0, 40); }
  else if (e.type === 'c2s'){ code = e.cmd + ' ' + (e.name || ''); msg = 'len=' + e.len; }
  else if (e.type === 'error' || e.type === 'bye'){ cls += ' err'; code = e.type; msg = e.text || ''; }
  else { code = e.type; msg = e.text || ''; }
  row.className = cls;
  const t = new Date(e.t || Date.now()).toLocaleTimeString('zh-CN', {hour12:false});
  row.innerHTML = '<span class="t">'+esc(t)+'</span><span class="c">'+esc(code)+'</span><span class="m">'+esc(msg)+'</span>';
  body.appendChild(row);
  while (body.children.length > 200) body.removeChild(body.firstChild);
  body.scrollTop = body.scrollHeight;
}

async function doLogin(){
  if (busy) return;
  busy = true;
  $('#loginBtn').disabled = true;
  $('#hint').className = 'hint';
  $('#hint').textContent = '正在登录：鉴权 → token → 会话 → 进世界…（约 10–40s）';
  setPill('warn', '登录中…');
  try{
    const body = { account: $('#account').value.trim() || 'ACCOUNT', force: true };
    const pwd = $('#password').value;
    if (pwd) body.password = pwd;
    const r = await api('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    if (r.ok){
      $('#hint').className = 'hint ok';
      $('#hint').textContent = '登录成功，已进入世界（' + (r.elapsed || '?') + 's）';
    } else {
      $('#hint').className = 'hint err';
      $('#hint').textContent = r.error || r.dead_reason || '登录失败';
      if (r.proto_out) showOut(r.proto_out);
    }
  }catch(err){
    $('#hint').className = 'hint err';
    $('#hint').textContent = '请求失败：' + err;
  }finally{
    busy = false;
    $('#loginBtn').disabled = false;
    $('#password').value = '';
    refresh();
  }
}

function showOut(txt){ $('#out').textContent = txt; }

async function sendCmd(){
  const v = $('#cmdIn').value.trim();
  if (!v) return;
  $('#out').textContent = '发送 ' + v + ' …';
  try{
    const isNum = /^\d+$/.test(v);
    const r = await api('/api/send', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(isNum ? {cmd:+v, waitMs:5000} : {name:v, waitMs:5000})
    });
    if (!r.ok){ showOut('失败: ' + (r.error || JSON.stringify(r))); return; }
    const fr = (r.frames || [])[0];
    if (!fr){ showOut('（超时，无回包）'); return; }
    showOut('S2C ' + fr.cmd + ' ' + (fr.name || '') + ' len=' + fr.len + ' res=' + (fr.res ?? '') + '\n\n' + (fr.bodyHex || '').slice(0, 400));
  }catch(err){ showOut('请求失败: ' + err); }
}

async function pets(){
  $('#out').textContent = '正在取精灵列表 (2303)…';
  try{
    const r = await api('/api/pets', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
    if (!r.ok){ showOut('失败: ' + (r.error || JSON.stringify(r).slice(0,300))); return; }
    showOut('2303 回包 ' + (r.rawLen || 0) + ' 字节\n' + JSON.stringify(r.pets, null, 2).slice(0, 2000));
  }catch(err){ showOut('请求失败: ' + err); }
}

$('#loginBtn').addEventListener('click', doLogin);
$('#logoutBtn').addEventListener('click', async () => {
  await api('/api/logout', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
  $('#hint').className = 'hint'; $('#hint').textContent = '已断开。';
  since = 0; $('#evBody').innerHTML = ''; refresh();
});
$('#sendBtn').addEventListener('click', sendCmd);
$('#petsBtn').addEventListener('click', pets);
$('#cmdIn').addEventListener('keydown', e => { if (e.key === 'Enter') sendCmd(); });

refresh();
pollTimer = setInterval(refresh, 1200);
</script>
</body>
</html>
